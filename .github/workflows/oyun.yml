name: Oyunu yayınla ve APK derle

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip'i aç
        run: |
          unzip -o -q ns-street.zip -d _zip
          mkdir -p site
          cp -r _zip/ns-street/. site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  yayinla:
    needs: site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Capacitor projesi hazırla
        run: |
          unzip -o -q ns-street.zip -d _zip
          mkdir app && cd app
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          mkdir www
          cp -r ../_zip/ns-street/. www/
          rm -f www/sw.js
          npx cap init "NS Street" com.sametak.nsstreet --web-dir www
          npx cap add android
      - name: Yatay ekran, tam ekran ve ikon
        run: |
          cd app/android/app/src/main
          sed -i 's/<activity/<activity android:screenO
