name: Oyunu yayınla ve APK derle

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip'i aç
        run: |
          unzip -o -q ns-street.zip -d _zip
          mkdir -p site
          cp -r _zip/ns-street/. site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  yayinla:
    needs: site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Capacitor projesi hazırla
        run: |
          unzip -o -q ns-street.zip -d _zip
          mkdir app && cd app
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          mkdir www
          cp -r ../_zip/ns-street/. www/
          rm -f www/sw.js
          npx cap init "NS Street" com.sametak.nsstreet --web-dir www
          npx cap add android
      - name: Yatay ekran, tam ekran ve ikon
        run: |
          cd app/android/app/src/main
          sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape"/' AndroidManifest.xml
          sed -i 's#</style>#<item name="android:windowFullscreen">true</item></style>#g' res/values/styles.xml
          rm -rf res/mipmap-anydpi-v26
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}; s=${d##*:}
            convert ../../../../www/icons/icon-512.png -resize ${s}x${s} res/mipmap-$n/ic_launcher.png
            cp res/mipmap-$n/ic_launcher.png res/mipmap-$n/ic_launcher_round.png
          done
      - name: APK derle
        run: |
          cd app/android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: NS-Street-APK
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
